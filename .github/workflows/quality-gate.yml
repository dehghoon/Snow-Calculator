name: Production Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-engine:
    name: Agent #2 engine + backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packages/nbcc2020_roof_snow_engine/pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/nbcc2020_roof_snow_engine[test]"
          python -m pip install -r backend/requirements.txt

      - name: Run Agent #2 engine tests
        working-directory: packages/nbcc2020_roof_snow_engine
        run: python -m pytest -q

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: app:../packages/nbcc2020_roof_snow_engine/src
        run: python -m pytest -q

  web:
    name: Web tests + production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Run web tests
        working-directory: web
        run: npm test -- --passWithNoTests

      - name: Build production web bundle
        working-directory: web
        run: npm run build
