<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Roof projection or parapet snow drift geometry</title><desc id="desc">Clean application diagram based on the workbook roof-obstruction reference figure. It identifies projection height h, longest horizontal dimension l0, x, drift length xd and sheltered extent 10 h prime.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#31536d"/></marker></defs><rect width="760" height="430" rx="18" fill="#fff"/><g transform="translate(65 42)"><path d="M0 125H560" stroke="#15385a" stroke-width="4"/><path d="M205 125V42H230V125" fill="#d8e9f6" stroke="#15385a" stroke-width="4"/><path d="M205 42L330 78V125" fill="#eef6fb" stroke="#15385a" stroke-width="3"/><g stroke="#31536d" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"><path d="M175 43V125"/><path d="M210 18H330"/></g><g fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="18"><text x="105" y="88">h — projection height</text><text x="242" y="14">l₀ — longest dimension</text><text x="205" y="154">roof obstruction / parapet</text></g></g><g transform="translate(75 255)"><text x="0" y="-22" fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Snow-load distribution adjacent to obstruction</text><path d="M0 85V0L120 48H395V72H520" fill="#d8e9f6" stroke="#125a88" stroke-width="3"/><line x1="0" y1="98" x2="120" y2="98" stroke="#31536d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="43" y="122" fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="17">x<tspan baseline-shift="sub" font-size="12">d</tspan></text><line x1="0" y1="142" x2="395" y2="142" stroke="#31536d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="145" y="168" fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="17">x = 10 h′</text></g></svg>