<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Lower adjacent roof snow drift geometry</title><desc id="desc">Application diagram identifying roof step height h, parapet height hp on both roof edges, slope alpha, x, drift length xd and sheltered extent 10 h prime.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#31536d"/></marker></defs><rect width="760" height="430" rx="18" fill="#fff"/><g fill="none" stroke="#15385a" stroke-width="4" stroke-linejoin="round"><path d="M70 170V72H300V138H650"/><path d="M70 170H650"/><path d="M70 72V45H92V72"/><path d="M628 138V111H650V138"/></g><g stroke="#31536d" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"><path d="M340 65V136"/><path d="M110 45V72"/><path d="M610 111V138"/><path d="M326 190H570"/><path d="M326 225H475"/></g><g fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="18"><text x="350" y="105">h — roof step height</text><text x="120" y="63">hₚ</text><text x="565" y="126">hₚ</text><text x="430" y="128">α — roof slope</text><text x="430" y="185">x</text><text x="390" y="218">x<tspan baseline-shift="sub" font-size="13">d</tspan> — drift length</text></g><g transform="translate(75 285)"><text x="0" y="-22" fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Snow-load distribution</text><path d="M0 85V0L120 48H395V72H520" fill="#d8e9f6" stroke="#125a88" stroke-width="3"/><line x1="0" y1="98" x2="120" y2="98" stroke="#31536d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="43" y="122" fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="17">x<tspan baseline-shift="sub" font-size="12">d</tspan></text><line x1="0" y1="142" x2="395" y2="142" stroke="#31536d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="145" y="168" fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="17">sheltered extent = 10 h′</text></g></svg>