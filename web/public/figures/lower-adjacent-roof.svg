<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Lower adjacent roof snow drift geometry</title><desc id="desc">Application diagram aligned with NBCC Figure 4.1.6.5.-A showing a single parapet height hp on the upper roof, roof step height h, horizontal distance x, lower-roof slope alpha and drift length xd.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#31536d"/></marker></defs><rect width="760" height="430" rx="18" fill="#fff"/><g fill="none" stroke="#15385a" stroke-width="4" stroke-linejoin="round"><path d="M70 138H300V248H655"/><path d="M70 138V72H92V138"/><path d="M655 248V325H70V138"/></g><g stroke="#31536d" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"><path d="M112 74V136"/><path d="M340 140V246"/><path d="M330 105H520"/><path d="M330 285H505"/></g><g fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="18"><text x="120" y="108">hₚ — parapet height</text><text x="350" y="198">h — roof step height</text><text x="408" y="98">x</text><text x="540" y="238">α — lower-roof slope</text><text x="392" y="278">x<tspan baseline-shift="sub" font-size="13">d</tspan> — drift length</text></g><g transform="translate(75 340)"><text x="0" y="-18" fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Snow-load distribution</text><path d="M0 60V5L120 35H395V50H520" fill="#d8e9f6" stroke="#125a88" stroke-width="3"/><line x1="0" y1="75" x2="120" y2="75" stroke="#31536d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="43" y="98" fill="#10223a" font-family="Inter,Arial,sans-serif" font-size="17">x<tspan baseline-shift="sub" font-size="12">d</tspan></text></g></svg>